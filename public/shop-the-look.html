<!doctype html>
<!--
  Shop the Look — standalone single-file section (FLEECE.)
  ==========================================================
  A self-contained HTML + CSS + JS section. No build step, no backend.
  Open it directly in a browser, or serve it from the store's public/
  folder at /shop-the-look.html.

  HOW TO SWAP THE IMAGES
  ----------------------
  Everything comes from the LOOKS array at the bottom of the <script>.
  Each look has one model image and three products. To use your own
  photos, replace the file paths in that array — nothing else changes.

  The model photos shipped here are JPGs on a pure white background,
  NOT true transparent PNGs. They are rendered with
  `mix-blend-mode: multiply`, which makes the white background
  disappear against this section's white / very light grey background.
  If you swap in real transparent PNGs, the same code works unchanged —
  the blend mode is harmless for images that already have transparency.

  Product thumbnails live in products/ (cropped photos of the trousers).
  Packs show their two photos side by side.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop the Look — FLEECE.</title>
<!--
  Inter from Google Fonts with a system fallback stack, so the page
  still looks right offline (Helvetica Neue / Arial).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ */
/*  Tokens                                                             */
/* ------------------------------------------------------------------ */
:root {
  --ink: #111111;
  --grey: #6f6f6f;
  --faint: #9a9a9a;
  --line: #e7e7e7;
  --panel: #fafafa;
  /* Spring-like ease used for the detail glide (spec). */
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font);
  color: var(--ink);
  background: #fff;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
img { display: block; }

/* Visible keyboard focus everywhere (spec: keyboard-accessible). */
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ------------------------------------------------------------------ */
/*  Section shell — white studio background with a soft radial glow   */
/* ------------------------------------------------------------------ */
.stl {
  background:
    radial-gradient(1200px 600px at 50% 0%, #f4f4f6 0%, #ffffff 55%, #f7f7f8 100%);
  padding: 0 clamp(16px, 4vw, 56px) clamp(48px, 6vw, 80px);
  overflow: hidden;
}

/* ------------------------------------------------------------------ */
/*  Minimal top nav (standalone file only — the Next.js version uses   */
/*  the site's own header instead)                                     */
/* ------------------------------------------------------------------ */
.stl-nav {
  display: flex;
  align-items: center;
  gap: 24px;
  height: 72px;
  max-width: 1600px;
  margin: 0 auto;
}
.stl-nav-logo {
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.04em;
  text-decoration: none;
  color: var(--ink);
  flex: 0 0 auto;
}
.stl-nav-links {
  display: flex;
  gap: 28px;
  margin: 0 auto;
}
.stl-nav-links a {
  color: var(--ink);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.stl-nav-links a:hover { opacity: 0.55; }
.stl-nav-search {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 8px 14px;
}
.stl-nav-search input {
  border: 0;
  outline: 0;
  background: transparent;
  font: inherit;
  font-size: 13px;
  width: 120px;
  color: var(--ink);
}
.stl-nav-search input::placeholder { color: var(--faint); }

/* ------------------------------------------------------------------ */
/*  Heading — crossfades between the default title and the look title */
/* ------------------------------------------------------------------ */
.stl-head {
  position: relative;
  max-width: 1600px;
  margin: 8px auto 0;
  /* Fixed height so the crossfade never shifts the layout. */
  min-height: 118px;
}
.stl-heading {
  position: absolute;
  inset: 0;
  transition: opacity 0.45s ease, transform 0.45s var(--ease-out);
}
.stl-heading h1,
.stl-heading h2 {
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.98;
  font-size: clamp(38px, 5vw, 64px);
}
.stl-heading p {
  margin: 12px 0 0;
  font-size: 14px;
  color: var(--grey);
  letter-spacing: -0.01em;
}
.stl-heading-detail {
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
}
.stl.is-detail .stl-heading-default {
  opacity: 0;
  transform: translateY(-10px);
  pointer-events: none;
}
.stl.is-detail .stl-heading-detail {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.stl-eyebrow {
  display: block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 8px;
}

/* ------------------------------------------------------------------ */
/*  Body grid: stage (left) + "In this look" panel (right)             */
/* ------------------------------------------------------------------ */
.stl-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: clamp(20px, 3vw, 48px);
  max-width: 1600px;
  margin: 24px auto 0;
  align-items: start;
}

/* ------------------------------------------------------------------ */
/*  Stage                                                              */
/* ------------------------------------------------------------------ */
.stl-stage {
  position: relative;
  /* Fixed heights: the model is a fixed px height, so the 1.6x detail
     scale always fits inside the taller detail stage. */
  height: 560px;
  transition: height 0.6s var(--spring);
}
.stl.is-detail .stl-stage { height: 820px; }

/* The scroll viewport: hidden overflow on desktop; on small screens it
   becomes the horizontally scrollable / swipeable lineup (spec). */
.stl-scroll {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.stl.is-detail .stl-scroll { overflow: visible; }
/* Hidden models must not stay clickable in detail view. */
.stl.is-detail .stl-model.is-hidden-model { pointer-events: none; }
.stl-track {
  position: relative;
  height: 100%;
  width: 100%;
  /* Mouse-move parallax is applied here (transform only, rAF). */
  will-change: transform;
}

/* ------------------------------------------------------------------ */
/*  Model                                                              */
/*  Layered so each motion has its own element (no transform fights):  */
/*    .stl-model       — slot position, depth scale, detail glide      */
/*    .stl-model-rise  — IntersectionObserver entrance (rise + fade)   */
/*    .stl-model-float — gentle idle float                             */
/*    .stl-model-hover — hover lift                                    */
/* ------------------------------------------------------------------ */
.stl-model {
  position: absolute;
  bottom: 0;
  /* Slot centre: evenly spaced across the track. */
  left: calc((var(--i) + 0.5) * 100% / 6);
  height: 500px;
  aspect-ratio: 1 / 2;
  /* --s: depth/detail scale. --hs: 0.95 when fading away in detail.
     --dx: px glide-to-centre offset, set from JS when entering detail. */
  transform: translateX(-50%) translateX(var(--dx, 0px))
    scale(calc(var(--s, 1) * var(--hs, 1)));
  opacity: var(--o, 1);
  filter: blur(var(--b, 0px)) brightness(var(--dim, 1));
  transition:
    transform 0.65s var(--spring),
    opacity 0.5s ease-out,
    filter 0.5s ease-out;
  z-index: var(--z, 1);
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
  will-change: transform, opacity, filter;
}
.stl-model-rise { height: 100%; opacity: 0; }
.stl.in-view .stl-model-rise {
  /* Rise up from the floor, staggered per model (set in JS). */
  animation: stl-rise 0.85s var(--spring) both;
  animation-delay: var(--rise-delay, 0ms);
}
@keyframes stl-rise {
  from { opacity: 0; transform: translateY(56px); }
  to   { opacity: 1; transform: translateY(0); }
}
.stl-model-float {
  height: 100%;
  animation: stl-float 5.5s ease-in-out infinite alternate;
  animation-delay: var(--float-delay, 0s);
}
@keyframes stl-float {
  from { transform: translateY(0); }
  to   { transform: translateY(-7px); }
}
.stl-model-hover { height: 100%; transition: transform 0.3s var(--ease-out); }
/* Hover: this model lifts 8px, the others dim to 70% (spec). */
.stl-model:hover .stl-model-hover,
.stl-model:focus-visible .stl-model-hover { transform: translateY(-8px); }
.stl-stage.is-hovering .stl-model:not(.is-hovered) { --dim: 0.7; }

.stl-model-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  /* The shipped model photos are JPGs on pure white, not transparent
     PNGs — multiply makes the white disappear on this light background.
     Harmless for real transparent PNGs: swap the array entries and the
     same code keeps working. */
  mix-blend-mode: multiply;
}

/* Soft elliptical floor shadow under each model. */
.stl-shadow {
  position: absolute;
  left: 50%;
  bottom: 2px;
  width: 72%;
  height: 16px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

/* ------------------------------------------------------------------ */
/*  Pins — pulsing dot on each outfit (lineup) and three pins on the   */
/*  outfit in detail view (one per product in the look).               */
/* ------------------------------------------------------------------ */
.stl-pin {
  position: absolute;
  left: var(--px, 50%);
  top: var(--py, 60%);
  width: 15px;
  height: 15px;
  margin: 0;
  padding: 0;
  border-radius: 50%;
  border: 2px solid #fff;
  background: var(--ink);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
  /* Counter-scale so pins stay the same size when the model is 1.6x. */
  transform: translate(-50%, -50%) scale(var(--pin-s, 1));
  transition: transform 0.3s var(--spring);
  z-index: 3;
}
.stl-pin::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 2px solid rgba(17, 17, 17, 0.55);
  animation: stl-pin-pulse 2.2s ease-out infinite;
}
@keyframes stl-pin-pulse {
  0%   { transform: scale(1);    opacity: 0.9; }
  70%  { transform: scale(2.1);  opacity: 0; }
  100% { transform: scale(2.1);  opacity: 0; }
}
.stl-pin:hover { transform: translate(-50%, -50%) scale(calc(var(--pin-s, 1) * 1.25)); }
.stl-pin.is-active { background: #fff; box-shadow: 0 0 0 2px var(--ink); }
/* Detail pins are hidden in the lineup and scale in on entry. */
.stl-pin-detail { display: none; }
.stl.is-detail .stl-pin-detail {
  display: block;
  animation: stl-pin-in 0.4s var(--spring) both;
  animation-delay: var(--pin-delay, 0ms);
}
@keyframes stl-pin-in {
  from { transform: translate(-50%, -50%) scale(0); }
  to   { transform: translate(-50%, -50%) scale(var(--pin-s, 1)); }
}
.stl.is-detail .stl-pin-lineup { display: none; }
.stl.is-detail .stl-pin { --pin-s: 0.625; } /* 1 / 1.6 keeps pins 15px. */

/* Back button — visible only in detail view. */
.stl-back {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 30;
  display: none;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(6px);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.stl.is-detail .stl-back { display: inline-flex; }

/* ------------------------------------------------------------------ */
/*  Controls — prev/next arrows + segmented progress bar               */
/* ------------------------------------------------------------------ */
.stl-controls {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-top: 20px;
}
.stl-arrow {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 18px;
  line-height: 1;
  color: var(--ink);
  transition: background 0.2s ease, color 0.2s ease;
}
.stl-arrow:hover { background: var(--ink); color: #fff; }
.stl-segments {
  display: flex;
  gap: 10px;
  flex: 1;
  min-width: 0;
}
.stl-segment {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
}
.stl-segment-bar {
  display: block;
  height: 2px;
  background: #d9d9d9;
  border-radius: 2px;
  transition: background 0.3s ease;
}
.stl-segment.is-active .stl-segment-bar { background: var(--ink); }
.stl-segment-label {
  display: block;
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stl-segment.is-active .stl-segment-label { color: var(--ink); }

/* ------------------------------------------------------------------ */
/*  "In this look" panel                                               */
/* ------------------------------------------------------------------ */
.stl-panel {
  position: sticky;
  top: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
}
.stl-panel-title {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--grey);
}
.stl-panel-look {
  margin: 10px 0 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.stl-panel-items { margin-top: 16px; display: grid; gap: 12px; }
/* Detail entry: panel slides in from the right, thumbs stagger 80ms. */
.stl.is-detail .stl-panel { animation: stl-panel-in 0.55s var(--spring) both; }
@keyframes stl-panel-in {
  from { opacity: 0; transform: translateX(28px); }
  to   { opacity: 1; transform: translateX(0); }
}
.stl.is-detail .stl-panel-item {
  animation: stl-item-in 0.5s var(--spring) both;
  animation-delay: var(--item-delay, 0ms);
}
@keyframes stl-item-in {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: translateX(0); }
}
.stl-panel-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 8px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: #fff;
  text-align: left;
  text-decoration: none;
  color: var(--ink);
  transition: border-color 0.2s ease;
}
.stl-panel-item:hover { border-color: var(--line); }
.stl-panel-item.is-active { border-color: var(--ink); }
.stl-thumb {
  flex: 0 0 64px;
  width: 64px;
  height: 64px;
  border-radius: 10px;
  overflow: hidden;
  background: #eee;
  display: flex;
}
.stl-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  mix-blend-mode: multiply;
}
.stl-thumb-split img { width: 50%; }
.stl-panel-item-name {
  display: block;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.stl-panel-item-colour {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  color: var(--grey);
}
.stl-panel-item-price {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.stl-panel-total {
  display: flex;
  justify-content: space-between;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  font-weight: 700;
}
.stl-add-all {
  display: none;
  width: 100%;
  margin-top: 14px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  padding: 15px 20px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  transition: opacity 0.2s ease, transform 0.2s var(--spring);
}
.stl-add-all:hover { opacity: 0.85; }
.stl-add-all:active { transform: scale(0.98); }
.stl.is-detail .stl-add-all { display: block; }
.stl-add-all.is-added { background: #1d7a3d; }
.stl-panel-note {
  margin: 12px 0 0;
  font-size: 12px;
  color: var(--faint);
  text-align: center;
}

/* ------------------------------------------------------------------ */
/*  Responsive                                                         */
/* ------------------------------------------------------------------ */
@media (max-width: 1023px) {
  .stl-body { grid-template-columns: 1fr; }
  .stl-panel { position: static; }
  .stl-stage { height: 520px; }
  .stl.is-detail .stl-stage { height: 760px; }
}
@media (max-width: 767px) {
  .stl-nav-links { display: none; }
  .stl-nav-search input { width: 84px; }
  .stl-head { min-height: 96px; }
  .stl-stage { height: 460px; }
  .stl.is-detail .stl-stage { height: 680px; }
  /* Lineup becomes a horizontally scrollable / swipeable row. */
  .stl-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .stl-scroll::-webkit-scrollbar { display: none; }
  .stl.is-detail .stl-scroll { overflow: hidden; }
  .stl-track { width: calc(6 * 58vw + 24px); min-width: 100%; }
  .stl-model { height: 400px; }
  /* Only the active look's name shows on small screens. */
  .stl-segment-label { display: none; }
  .stl-segment.is-active .stl-segment-label { display: block; }
}

/* ------------------------------------------------------------------ */
/*  Reduced motion — everything appears instantly, no float/parallax.  */
/* ------------------------------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  .stl-model-rise,
  .stl-model-float,
  .stl-pin::after,
  .stl.is-detail .stl-panel,
  .stl.is-detail .stl-panel-item,
  .stl.is-detail .stl-pin-detail {
    animation: none !important;
  }
  .stl-model,
  .stl-heading,
  .stl-panel-item,
  .stl-model-hover {
    transition-duration: 0.01ms !important;
  }
  .stl-model-rise { opacity: 1; }
  .stl-stage { scroll-behavior: auto; }
}
</style>
</head>
<body>

<section class="stl" id="shopTheLook" aria-label="Shop the Look">
  <!-- Minimal top nav (standalone file only). -->
  <nav class="stl-nav" aria-label="Primary">
    <a class="stl-nav-logo" href="/">FLEECE.</a>
    <div class="stl-nav-links">
      <a href="/collections/all">New In</a>
      <a href="/collections/all">Trousers</a>
      <a href="/collections/all">Packs</a>
      <a href="/collections/all">Collections</a>
      <a href="#shopTheLook">Lookbook</a>
    </div>
    <label class="stl-nav-search">
      <span aria-hidden="true">⌕</span>
      <input type="search" placeholder="Search" aria-label="Search">
    </label>
  </nav>

  <!-- Heading: crossfades into the look title in detail view. -->
  <div class="stl-head">
    <div class="stl-heading stl-heading-default">
      <h1>Shop the Look.</h1>
      <p>Six looks, styled head to toe. Tap a pin to see the pieces.</p>
    </div>
    <div class="stl-heading stl-heading-detail" aria-hidden="true">
      <h2><span class="stl-eyebrow" id="detailEyebrow">Look 01</span><span id="detailTitle">Street Layers</span></h2>
      <p id="detailSubtitle">Three pieces — Jet Black, Charcoal, Navy.</p>
    </div>
  </div>

  <div class="stl-body">
    <div>
      <div class="stl-stage" id="stage">
        <div class="stl-scroll" id="scroll">
          <div class="stl-track" id="track"><!-- models injected by JS --></div>
        </div>
        <button class="stl-back" id="backBtn" type="button">← Back to looks</button>
      </div>

      <div class="stl-controls">
        <button class="stl-arrow" id="prevBtn" type="button" aria-label="Previous look">←</button>
        <button class="stl-arrow" id="nextBtn" type="button" aria-label="Next look">→</button>
        <div class="stl-segments" id="segments" role="tablist" aria-label="Looks"></div>
      </div>
    </div>

    <!-- "In this look" panel -->
    <aside class="stl-panel" id="panel" aria-label="In this look">
      <p class="stl-panel-title">In this look</p>
      <p class="stl-panel-look" id="panelLook">01 · Street Layers</p>
      <div class="stl-panel-items" id="panelItems"></div>
      <div class="stl-panel-total"><span>Total</span><span id="panelTotal">Rs 6,597</span></div>
      <button class="stl-add-all" id="addAllBtn" type="button">Add all to bag — <span id="addAllTotal">Rs 6,597</span></button>
      <p class="stl-panel-note">Cash on delivery · 7-day exchange</p>
    </aside>
  </div>
</section>

<script>
"use strict";
/* ================================================================== */
/*  DATA — swap images here. One entry per look.                       */
/*  model:  full-body model photo (JPG on white here; transparent PNG */
/*          works too — see the mix-blend-mode note in the CSS).       */
/*  pins:   positions on the outfit in detail view, one per product,   */
/*          as fractions of the model image (x: 0–1 left→right,        */
/*          y: 0–1 top→bottom).                                        */
/* ================================================================== */
const LOOKS = [
  {
    id: "street-layers", num: "01", name: "Street Layers",
    model: "models/model-street-layers.jpg",
    alt: "Model wearing Jet Black fleece trousers and a charcoal crewneck",
    pins: [
      { x: 0.50, y: 0.44 }, { x: 0.38, y: 0.63 }, { x: 0.62, y: 0.86 },
    ],
    products: [
      { id: "black",    name: "Classic Fleece Trouser", colour: "Jet Black",  price: 2199, slug: "classic-fleece-trouser-jet-black",      images: ["products/black.jpg"] },
      { id: "charcoal", name: "Classic Fleece Trouser", colour: "Charcoal",   price: 2199, slug: "classic-fleece-trouser-charcoal",       images: ["products/charcoal.jpg"] },
      { id: "navy",     name: "Classic Fleece Trouser", colour: "Navy",      price: 2199, slug: "classic-fleece-trouser-navy",           images: ["products/navy.jpg"] },
    ],
  },
  {
    id: "studio-day", num: "02", name: "Studio Day",
    model: "models/model-studio-day.jpg",
    alt: "Model wearing Navy fleece trousers and a black T-shirt",
    pins: [
      { x: 0.50, y: 0.44 }, { x: 0.38, y: 0.63 }, { x: 0.62, y: 0.86 },
    ],
    products: [
      { id: "navy",  name: "Classic Fleece Trouser", colour: "Navy",        price: 2199, slug: "classic-fleece-trouser-navy",           images: ["products/navy.jpg"] },
      { id: "grey",  name: "Classic Fleece Trouser", colour: "Heather Grey", price: 2199, slug: "classic-fleece-trouser-heather-grey",  images: ["products/grey.jpg"] },
      { id: "black", name: "Classic Fleece Trouser", colour: "Jet Black",    price: 2199, slug: "classic-fleece-trouser-jet-black",      images: ["products/black.jpg"] },
    ],
  },
  {
    id: "gallery-opening", num: "03", name: "Gallery Opening",
    model: "models/model-gallery-opening.jpg",
    alt: "Model wearing Chocolate Brown fleece trousers and an olive sweatshirt",
    pins: [
      { x: 0.50, y: 0.44 }, { x: 0.38, y: 0.63 }, { x: 0.62, y: 0.86 },
    ],
    products: [
      { id: "brown",    name: "Classic Fleece Trouser", colour: "Chocolate Brown", price: 2199, slug: "classic-fleece-trouser-chocolate-brown", images: ["products/brown.jpg"] },
      { id: "olive",    name: "Classic Fleece Trouser", colour: "Olive",           price: 2199, slug: "classic-fleece-trouser-olive",           images: ["products/olive.jpg"] },
      { id: "charcoal", name: "Classic Fleece Trouser", colour: "Charcoal",        price: 2199, slug: "classic-fleece-trouser-charcoal",        images: ["products/charcoal.jpg"] },
    ],
  },
  {

    model: "models/model-night-in.jpg",

    pins: [

    products: [
      { id: "charcoal", name: "Classic Fleece Trouser", colour: "Charcoal",    price: 2199, slug: "classic-fleece-trouser-charcoal",      images: ["products/charcoal.jpg"] },
      { id: "grey",     name: "Classic Fleece Trouser", colour: "Heather Grey", price: 2199, slug: "classic-fleece-trouser-heather-grey", images: ["products/grey.jpg"] },
      { id: "black",    name: "Classic Fleece Trouser", colour: "Jet Black",    price: 2199, slug: "classic-fleece-trouser-jet-black",     images: ["products/black.jpg"] },
    ],
  },
  {
    id: "essentials", num: "05", name: "The Essentials",
    model: "models/model-essentials.jpg",
    alt: "Model wearing Heather Grey fleece trousers and a white T-shirt",
    pins: [
      { x: 0.50, y: 0.44 }, { x: 0.38, y: 0.63 }, { x: 0.62, y: 0.86 },
    ],
    products: [
      { id: "pack-black-charcoal", name: "Pack of 2 — Fleece Trousers", colour: "Black + Charcoal", price: 3499, slug: "pack-of-2-fleece-trousers-black-charcoal", images: ["products/black.jpg", "products/charcoal.jpg"] },
      { id: "navy", name: "Classic Fleece Trouser", colour: "Navy",        price: 2199, slug: "classic-fleece-trouser-navy",          images: ["products/navy.jpg"] },
      { id: "grey", name: "Classic Fleece Trouser", colour: "Heather Grey", price: 2199, slug: "classic-fleece-trouser-heather-grey", images: ["products/grey.jpg"] },
    ],
  },
  {
    id: "off-duty", num: "06", name: "Off Duty",
    model: "models/model-off-duty.jpg",
    alt: "Model wearing Olive fleece trousers and a cream oversized T-shirt",
    pins: [
      { x: 0.50, y: 0.44 }, { x: 0.38, y: 0.63 }, { x: 0.62, y: 0.86 },
    ],
    products: [
      { id: "olive",    name: "Classic Fleece Trouser", colour: "Olive",           price: 2199, slug: "classic-fleece-trouser-olive",           images: ["products/olive.jpg"] },
      { id: "charcoal", name: "Classic Fleece Trouser", colour: "Charcoal",        price: 2199, slug: "classic-fleece-trouser-charcoal",        images: ["products/charcoal.jpg"] },
      { id: "brown",    name: "Classic Fleece Trouser", colour: "Chocolate Brown", price: 2199, slug: "classic-fleece-trouser-chocolate-brown", images: ["products/brown.jpg"] },
    ],
  },
];

const fmt = (n) => "Rs " + n.toLocaleString("en-PK");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================================================================== */
/*  State + element refs                                               */
/* ================================================================== */
const section = document.getElementById("shopTheLook");
const stage = document.getElementById("stage");
const scrollEl = document.getElementById("scroll");
const track = document.getElementById("track");
const panel = document.getElementById("panel");
const panelItems = document.getElementById("panelItems");
const panelLook = document.getElementById("panelLook");
const panelTotal = document.getElementById("panelTotal");
const addAllBtn = document.getElementById("addAllBtn");
const addAllTotal = document.getElementById("addAllTotal");
const backBtn = document.getElementById("backBtn");
const segmentsEl = document.getElementById("segments");

let active = 0;                 // selected look (lineup focus + panel)
let mode = "lineup";            // "lineup" | "detail"
let detailTarget = null;        // look index shown in detail view
let modelEls = [];              // one <button> per look, in LOOKS order

/* Depth of field in the lineup: distance from the row centre (2.5). */
function depthFor(i) {
  const d = Math.abs(i - (LOOKS.length - 1) / 2);
  return {
    s: Math.max(0.86, 1 - 0.055 * d),
    b: (d * 1.2).toFixed(1) + "px",
    o: Math.max(0.8, 1 - 0.08 * d).toFixed(2),
    z: 10 - Math.round(d),
  };
}

/* ================================================================== */
/*  Build the models + controls once from the LOOKS array              */
/* ================================================================== */
LOOKS.forEach((look, i) => {
  const depth = depthFor(i);

  // The model is a <div role="button">, NOT a <button>: the pins inside
  // it are real <button>s, and buttons cannot legally nest in HTML
  // (the parser would break the markup apart).
  const btn = document.createElement("div");
  btn.className = "stl-model";
  btn.setAttribute("role", "button");
  btn.tabIndex = 0;
  btn.style.setProperty("--i", i);
  btn.style.setProperty("--rise-delay", i * 90 + "ms");
  btn.style.setProperty("--float-delay", i * 0.45 + "s");
  btn.setAttribute("aria-label", "View look " + look.num + ", " + look.name);
  btn.dataset.index = i;

  // One pulsing pin in the lineup + three product pins in detail view.
  const pinsHtml =
    '<button type="button" class="stl-pin stl-pin-lineup" style="--px:50%;--py:62%" aria-label="See the pieces in this look"></button>' +
    look.pins
      .map(
        (p, pi) =>
          '<button type="button" class="stl-pin stl-pin-detail" style="--px:' +
          p.x * 100 + "%;--py:" + p.y * 100 + "%;--pin-delay:" + (pi * 80 + 120) +
          'ms" data-pin="' + pi + '" aria-label="Piece ' + (pi + 1) + ": " +
          look.products[pi].colour + '"></button>',
      )
      .join("");

  btn.innerHTML =
    '<span class="stl-model-rise"><span class="stl-model-float">' +
    '<span class="stl-shadow"></span>' +
    '<span class="stl-model-hover">' +
    '<img class="stl-model-img" src="' + look.model + '" alt="' + look.alt + '" loading="' +
    (i === 0 ? "eager" : "lazy") + '" draggable="false">' +
    pinsHtml +
    "</span></span></span>";

  btn.addEventListener("click", (e) => {
    // A pin click highlights its product instead of opening detail view.
    const pin = e.target.closest(".stl-pin");
    if (pin) {
      e.stopPropagation();
      highlightProduct(pin.dataset.pin === undefined ? 0 : Number(pin.dataset.pin));
      return;
    }
    if (mode === "detail" && detailTarget === i) return;
    enterDetail(i);
  });
  // Keyboard: Enter / Space on a focused model opens its detail view.
  btn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (mode === "detail" && detailTarget === i) return;
      enterDetail(i);
    }
  });
  btn.addEventListener("mouseenter", () => {
    stage.classList.add("is-hovering");
    btn.classList.add("is-hovered");
  });
  btn.addEventListener("mouseleave", () => {
    stage.classList.remove("is-hovering");
    btn.classList.remove("is-hovered");
  });
  btn.addEventListener("focus", () => btn.classList.add("is-hovered"));
  btn.addEventListener("blur", () => btn.classList.remove("is-hovered"));

  track.appendChild(btn);
  modelEls.push(btn);

  // Segmented progress bar: one segment per look.
  const seg = document.createElement("button");
  seg.type = "button";
  seg.className = "stl-segment";
  seg.setAttribute("role", "tab");
  seg.setAttribute("aria-label", "Look " + look.num + ", " + look.name);
  seg.innerHTML =
    '<span class="stl-segment-bar"></span><span class="stl-segment-label">' +
    look.num + " " + look.name + "</span>";
  seg.addEventListener("click", () => {
    if (mode === "detail") switchDetail(i);
    else setActive(i);
  });
  segmentsEl.appendChild(seg);
});

/* ================================================================== */
/*  Panel                                                              */
/* ================================================================== */
function thumbHtml(p) {
  const imgs = p.images
    .map((src) => '<img src="' + src + '" alt="" loading="lazy" draggable="false">')
    .join("");
  return (
    '<span class="stl-thumb' + (p.images.length > 1 ? " stl-thumb-split" : "") + '">' +
    imgs + "</span>"
  );
}

function renderPanel() {
  const look = LOOKS[active];
  panelLook.textContent = look.num + " · " + look.name;
  const total = look.products.reduce((n, p) => n + p.price, 0);
  panelTotal.textContent = fmt(total);
  addAllTotal.textContent = fmt(total);
  panelItems.innerHTML = look.products
    .map(
      (p, pi) =>
        '<a class="stl-panel-item" style="--item-delay:' + pi * 80 + 'ms" href="/products/' +
        p.slug + '" data-pi="' + pi + '">' +
        thumbHtml(p) +
        '<span><span class="stl-panel-item-name">' + p.name + '</span>' +
        '<span class="stl-panel-item-colour">' + p.colour + "</span></span>" +
        '<span class="stl-panel-item-price">' + fmt(p.price) + "</span></a>",
    )
    .join("");
  // Re-trigger the stagger animation when the panel re-renders in detail.
  if (mode === "detail") {
    panel.classList.remove("is-detail");
    void panel.offsetWidth;
    panel.classList.add("is-detail");
  }
  document.querySelectorAll(".stl-panel-item").forEach((row) => {
    row.addEventListener("mouseenter", () => highlightProduct(Number(row.dataset.pi)));
  });
}

function highlightProduct(pi) {
  document.querySelectorAll(".stl-panel-item").forEach((row, i) => {
    row.classList.toggle("is-active", i === pi);
  });
  document.querySelectorAll(".stl-pin-detail").forEach((pin) => {
    pin.classList.toggle("is-active", Number(pin.dataset.pin) === pi);
  });
}

/* ================================================================== */
/*  Lineup <-> detail transitions                                      */
/* ================================================================== */

/* Measure the px glide that puts model i at the centre of the stage. */
function centreModel(i) {
  const el = modelEls[i];
  const stageRect = scrollEl.getBoundingClientRect();
  // offsetLeft/offsetWidth are untransformed slot geometry (the model's
  // offsetParent is the relatively-positioned track), so the glide
  // distance stays correct even while other transforms are applied.
  const slotCentre = el.offsetLeft + el.offsetWidth / 2;
  const trackRect = track.getBoundingClientRect();
  const visibleCentre = stageRect.left + stageRect.width / 2;
  const modelCentre = trackRect.left + slotCentre;
  el.style.setProperty("--dx", Math.round(visibleCentre - modelCentre) + "px");
}

function applyModelStates() {
  modelEls.forEach((el, i) => {
    const depth = depthFor(i);
    // Hidden models must not stay clickable in detail view.
    el.classList.toggle("is-detail-target", mode === "detail" && i === detailTarget);
    el.classList.toggle("is-hidden-model", mode === "detail" && i !== detailTarget);
    if (mode === "detail") {
      if (i === detailTarget) {
        // Chosen model: full size, sharp, glides to the centre at 1.6x.
        el.style.setProperty("--s", "1.6");
        el.style.setProperty("--hs", "1");
        el.style.setProperty("--o", "1");
        el.style.setProperty("--b", "0px");
        el.style.setProperty("--z", "20");
      } else {
        // Everyone else fades out and blurs away (spec: 500ms ease-out,
        // opacity 0, scale 0.95 — handled by the CSS transitions).
        el.style.setProperty("--s", String(depth.s));
        el.style.setProperty("--hs", "0.95");
        el.style.setProperty("--o", "0");
        el.style.setProperty("--b", "8px");
        el.style.setProperty("--z", "1");
      }
    } else {
      el.style.setProperty("--dx", "0px");
      el.style.setProperty("--s", String(depth.s));
      el.style.setProperty("--hs", "1");
      el.style.setProperty("--o", String(depth.o));
      el.style.setProperty("--b", depth.b);
      el.style.setProperty("--z", String(depth.z));
    }
  });
  document.querySelectorAll(".stl-segment").forEach((seg, i) => {
    seg.classList.toggle("is-active", i === active);
    seg.setAttribute("aria-selected", i === active ? "true" : "false");
  });
}

function setActive(i) {
  active = (i + LOOKS.length) % LOOKS.length;
  applyModelStates();
  renderPanel();
}

function enterDetail(i) {
  mode = "detail";
  detailTarget = i;
  active = i;
  section.classList.add("is-detail");
  const look = LOOKS[i];
  document.getElementById("detailEyebrow").textContent = "Look " + look.num;
  document.getElementById("detailTitle").textContent = look.name;
  document.getElementById("detailSubtitle").textContent =
    "Three pieces — " + look.products.map((p) => p.colour).join(", ") + ".";
  centreModel(i);
  applyModelStates();
  renderPanel();
  backBtn.focus({ preventScroll: true });
}

function switchDetail(i) {
  // Crossfade between models while staying in detail view.
  detailTarget = (i + LOOKS.length) % LOOKS.length;
  active = detailTarget;
  const look = LOOKS[active];
  document.getElementById("detailEyebrow").textContent = "Look " + look.num;
  document.getElementById("detailTitle").textContent = look.name;
  document.getElementById("detailSubtitle").textContent =
    "Three pieces — " + look.products.map((p) => p.colour).join(", ") + ".";
  // Measure the new model's glide after the old one starts leaving.
  requestAnimationFrame(() => {
    centreModel(active);
    applyModelStates();
    renderPanel();
  });
}

function exitDetail() {
  mode = "lineup";
  detailTarget = null;
  section.classList.remove("is-detail");
  applyModelStates();
  renderPanel();
}

/* ------------------------------------------------------------------ */
/*  Controls                                                           */
/* ------------------------------------------------------------------ */
document.getElementById("prevBtn").addEventListener("click", () => {
  if (mode === "detail") switchDetail(detailTarget - 1);
  else setActive(active - 1);
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (mode === "detail") switchDetail(detailTarget + 1);
  else setActive(active + 1);
});
backBtn.addEventListener("click", exitDetail);
// Clicking empty stage background in detail view goes back.
stage.addEventListener("click", (e) => {
  if (mode === "detail" && e.target === stage) exitDetail();
});
scrollEl.addEventListener("click", (e) => {
  if (mode === "detail" && (e.target === scrollEl || e.target === track)) exitDetail();
});

// "Add all to bag" (standalone demo: no backend — show an added state).
addAllBtn.addEventListener("click", () => {
  const look = LOOKS[active];
  const total = look.products.reduce((n, p) => n + p.price, 0);
  addAllBtn.classList.add("is-added");
  addAllBtn.textContent = "Added to bag ✓ — " + fmt(total);
  setTimeout(() => {
    addAllBtn.classList.remove("is-added");
    addAllBtn.innerHTML = 'Add all to bag — <span id="addAllTotal">' + fmt(total) + "</span>";
  }, 1800);
});

// Keyboard: Esc goes back; arrows switch looks (in detail view).
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && mode === "detail") exitDetail();
  if (mode !== "detail") return;
  if (e.key === "ArrowLeft") switchDetail(detailTarget - 1);
  if (e.key === "ArrowRight") switchDetail(detailTarget + 1);
});
stage.addEventListener("keydown", (e) => {
  if (mode !== "lineup") return;
  if (e.key === "ArrowLeft") setActive(active - 1);
  if (e.key === "ArrowRight") setActive(active + 1);
});

// Swipe: horizontal swipe switches looks (detail) / active look (lineup).
let touchX = null;
stage.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) < 40) return;
  if (mode === "detail") switchDetail(detailTarget + (dx < 0 ? 1 : -1));
  else setActive(active + (dx < 0 ? 1 : -1));
}, { passive: true });

/* ------------------------------------------------------------------ */
/*  Entrance (IntersectionObserver) + idle parallax                    */
/* ------------------------------------------------------------------ */
const io = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        section.classList.add("in-view");
        io.disconnect();
      }
    });
  },
  { threshold: 0.15 },
);
io.observe(section);

// Gentle parallax on mouse move (transform-only, rAF-throttled, and
// skipped entirely for touch users and reduced-motion users).
if (!reducedMotion && window.matchMedia("(pointer: fine)").matches) {
  let raf = null;
  section.addEventListener("mousemove", (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = stage.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width - 0.5; // -0.5 … 0.5
      track.style.transform = "translate3d(" + (nx * -14).toFixed(1) + "px, 0, 0)";
    });
  });
  section.addEventListener("mouseleave", () => {
    track.style.transform = "";
  });
}

// Re-measure the detail glide if the window resizes mid-detail.
window.addEventListener("resize", () => {
  if (mode === "detail" && detailTarget !== null) centreModel(detailTarget);
});

/* Initial render. */
applyModelStates();
renderPanel();
</script>
